<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Familiar Faces</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Familiar Faces: drop the faces, two of the same merge into the next one up. From the arcade cabinet in This Feels Familiar.">
<meta name="theme-color" content="#120820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Familiar Faces">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
  @font-face { font-family: "InterX"; font-weight: 800; src: url("assets/Inter-ExtraBold.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "InterX"; font-weight: 600; src: url("assets/Inter-SemiBold.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120820; }
  body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #bg { position: absolute; top: -40px; right: -40px; bottom: -40px; left: -40px; background: #120820 url("assets/screen.jpg") center / cover no-repeat; -webkit-filter: blur(22px) brightness(0.45) saturate(1.1); filter: blur(22px) brightness(0.45) saturate(1.1); transform: translateZ(0); }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #game { position: absolute; display: block; image-rendering: auto;
    -webkit-mask-image: linear-gradient(to bottom, #000 93%, transparent 100%); mask-image: linear-gradient(to bottom, #000 93%, transparent 100%); }
  #boot { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; color: #f7e6da; font: 600 18px/1.4 "InterX", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .85; pointer-events: none; transition: opacity .4s; }
  #boot.hide { opacity: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"><canvas id="game"></canvas></div>
<div id="boot">loading</div>
<script src="game.js?v=4"></script>
</body>
</html>
